{% comment %}
Shared by the request and user statistics pages, so the two read as one report.
Colours come from the admin's own CSS variables, so both follow the light/dark
theme.
{% endcomment %}
<style>
  .stats-page { max-width: 60em; }
  .stats-page h2 { margin-top: 1.6em; border-bottom: 1px solid var(--hairline-color); padding-bottom: .2em; }
  .stats-page h3 { margin-top: 1.4em; font-size: 1em; color: var(--body-quiet-color); }
  .stats-page table { width: 100%; border-collapse: collapse; margin: 1em 0; }
  .stats-page th, .stats-page td { text-align: left; vertical-align: top; padding: .5em .7em;
      border-bottom: 1px solid var(--hairline-color); }
  .stats-page th { background: var(--darkened-bg); font-weight: 600; }
  .stats-page th.count, .stats-page td.count { text-align: right; white-space: nowrap;
      font-variant-numeric: tabular-nums; }
  .stats-page code { background: var(--darkened-bg); padding: .1em .35em; border-radius: 3px; }
  .stats-page .note { border-left: 3px solid var(--border-color); padding: .4em 0 .4em 1em;
      margin: 1em 0; color: var(--body-quiet-color); }
  .stats-page .rank { color: var(--body-quiet-color); width: 3em; }

  .stats-controls { display: flex; flex-wrap: wrap; gap: 1em; align-items: flex-end;
      background: var(--darkened-bg); border: 1px solid var(--hairline-color);
      border-radius: 4px; padding: .8em 1em; margin: 1em 0; }
  .stats-controls label { display: block; font-weight: 600; font-size: .8em;
      text-transform: uppercase; letter-spacing: .04em; color: var(--body-quiet-color);
      margin-bottom: .3em; }
  .stats-controls .period-links { display: inline-flex; gap: .1em; }
  .stats-controls .period-links > * { padding: .3em .7em; border: 1px solid var(--border-color);
      margin-left: -1px; }
  .stats-controls .period-links > :first-child { border-radius: 4px 0 0 4px; }
  .stats-controls .period-links > :last-child { border-radius: 0 4px 4px 0; }
  .stats-controls .period-links .current { background: var(--selected-bg);
      color: var(--body-fg); font-weight: 600; }
  .stats-controls input[type=text] { font-variant-numeric: tabular-nums; }

  .stats-summary { display: flex; flex-wrap: wrap; gap: 2.4em; margin: 1.4em 0; }
  .stats-summary .figure { font-size: 1.9em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stats-summary .lbl { font-size: .8em; text-transform: uppercase; letter-spacing: .04em;
      color: var(--body-quiet-color); }

  .stats-chart { width: 100%; height: auto; margin: 1em 0 .5em; overflow: visible; }
  .stats-chart .bar { fill: var(--primary); }
  .stats-chart .bar:hover { fill: var(--secondary); }
  .stats-chart .grid { stroke: var(--hairline-color); stroke-width: 1; }
  .stats-chart .axis { stroke: var(--border-color); stroke-width: 1; }
  .stats-chart text { fill: var(--body-quiet-color); font-size: 11px;
      font-family: var(--font-family-primary, sans-serif); }
  .stats-chart .ylabel { text-anchor: end; }
  .stats-chart .xlabel { text-anchor: middle; }
</style>

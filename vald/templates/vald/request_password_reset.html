{% extends "vald/base.html" %}

{% block content_class %}{% endblock %}

{% block content %}
<div class="pagehead">
  <div class="pagehead-titles">
    <h1>Reset your password</h1>
    <span class="pagesub">We will email you a link to set a new one.</span>
  </div>
</div>

<div class="card" style="max-width: 520px;">
  <form class="card-body" method="post" action="{% url 'vald:request_password_reset' %}">
    {% csrf_token %}
    <div class="loginfields">
      <label class="stacked" for="{{ form.email.id_for_label }}">{{ form.email.label }}
        {{ form.email }}
      </label>
    </div>
    <div class="btn-row" style="margin-top: 14px;">
      <button type="submit" class="btn-primary">Send reset link</button>
      <a class="hint" href="{% url 'vald:index' %}">Back to the front page</a>
    </div>
  </form>
</div>
{% endblock %}

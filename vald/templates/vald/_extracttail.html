{% comment %}
Everything the three extract forms have in common below their own fields:
output format, the line requirements, the linelist configuration, the comment
and the email-notify checkbox. One copy, so the three forms cannot drift apart.

A radio or checkbox group cannot use <label for>: each control already carries
its own label, and what is missing is a name for the group. role="group" plus
aria-labelledby gives it one without a <fieldset> spanning - and so breaking -
the two-column grid row.
{% endcomment %}
<div class="formrow">
  <div class="formlabel" id="lbl-format">Extraction format</div>
  <div class="formfield">
    <div class="radioset" role="group" aria-labelledby="lbl-format">{% for radio in form.format %}{{ radio }}{% endfor %}</div>
  </div>
</div>

<div class="formsplit"></div>

<div class="formrow">
  <div class="formlabel">Hyperfine structure</div>
  <div class="formfield"><label>{{ form.hfssplit }} {{ form.hfssplit.label }}</label></div>
</div>

<div class="formsplit"></div>

<div class="formrow top">
  <div class="formlabel" id="lbl-known">Require lines to have a known value of</div>
  <div class="checkgrid" role="group" aria-labelledby="lbl-known">
    <label>{{ form.hrad }} {{ form.hrad.label }}</label>
    <label>{{ form.hlande }} {{ form.hlande.label }}</label>
    <label>{{ form.hstark }} {{ form.hstark.label }}</label>
    <label>{{ form.hterm }} {{ form.hterm.label }}</label>
    <label>{{ form.hwaals }} {{ form.hwaals.label }}</label>
  </div>
</div>

<div class="formsplit"></div>

<div class="formrow top">
  <label class="formlabel" for="{{ form.pconf.id_for_label }}">Linelist configuration</label>
  <div class="formfield stack">{% include "vald/_pconf.html" %}</div>
</div>

<div class="formsplit"></div>

<div class="formrow">
  <label class="formlabel" for="{{ form.subject.id_for_label }}">Optional comment for request</label>
  <div class="formfield">{{ form.subject }}</div>
</div>

<div class="formsplit"></div>

<div class="formrow">
  <div class="formlabel">Notification</div>
  <div class="formfield"><label>{{ form.email_notify }} {{ form.email_notify.label }}</label></div>
</div>

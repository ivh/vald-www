[project]
name = "vald-www"
version = "1.0.0"
description = "VALD Web Interface - Django replacement for PHP app"
requires-python = ">=3.11"
dependencies = [
    # Pinned to the 5.2 LTS series: security fixes until April 2028, where 6.0
    # and 6.1 go EOL well before that. Next LTS to move to is 6.2 (April 2027).
    "django>=5.2,<6.0",
    "django-ratelimit>=4.1.0",
    "gunicorn>=21.0",
]

[project.optional-dependencies]
# The stdlib covers CSV, ECSV, VOTable and SQLite; these two buy FITS and
# Parquet. Kept optional so a deployment that does not want numpy does not get
# it - the download menu hides what it cannot produce.
formats = [
    "astropy>=6.0",
    "pyarrow>=15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-django>=4.11.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "vald_web.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = [
    "vald_binaries: needs a populated VALD_HOME (Fortran binaries and data); deselect with -m 'not vald_binaries'",
]
